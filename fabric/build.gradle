plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Common module
    implementation project(path: ':common', configuration: 'default')
    include project(path: ':common', configuration: 'default')

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:14.0.139"
    include "me.shedaniel.cloth:cloth-config-fabric:14.0.139"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJava = project.hasProperty('targetJava') ? project.property('targetJava').toString() : '17'

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(targetJava)
}

java {
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
    withSourcesJar()
}

base {
    archivesName = "${project.archives_base_name}-java${targetJava}"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
