plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.2'
}

group = 'com.chaoschickens'
version = '1.1.3'

repositories {
    mavenCentral()
    maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://repo.codemc.org/repository/maven-public/" }
    maven { url = "https://jitpack.io" }
}

dependencies {
    // Spigot API (provided)
    compileOnly "org.spigotmc:spigot-api:1.20.4-R0.1-SNAPSHOT"

    // ChaosChickens Common Module
    implementation project(':common')

    // bStats Metrics
    implementation "org.bstats:bstats-bukkit:3.0.2"

    // MockBukkit for testing
    testImplementation "com.github.seeseemelk:MockBukkit-v1.20:3.57.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def targetJava = project.hasProperty('targetJava') ? project.property('targetJava').toString() : '17'

java {
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("plugin.yml") {
        expand "project": project
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.bstats', 'com.chaoschickens.bukkit.bstats'
}

build.dependsOn shadowJar
