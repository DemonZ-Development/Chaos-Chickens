plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

evaluationDependsOn(':common')

version = project.mod_version
group = project.maven_group
def targetJava = project.hasProperty('targetJava') ? project.property('targetJava').toString() : '21'

base {
    archivesName = "${project.archives_base_name}-java${targetJava}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(targetJava))

minecraft {
    mappings channel: 'official', version: '1.21.1'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Common module
    implementation project(path: ':common', configuration: 'default')
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    from {
        project(':common').sourceSets.main.output
    }
    manifest {
        attributes([
                "Specification-Title"     : "chaoschickens",
                "Specification-Vendor"    : "ChaosChickens",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "ChaosChickens",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

reobf {
    jar {}
}

afterEvaluate {
    jar.finalizedBy('reobfJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
