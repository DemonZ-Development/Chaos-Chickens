plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'java-library'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Common module
    implementation project(path: ':common', configuration: 'default')
    include project(path: ':common', configuration: 'default')
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJava = project.hasProperty('targetJava') ? project.property('targetJava').toString() : '25'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(targetJava))
    }
    withSourcesJar()
}

base {
    archivesName = "${project.archives_base_name}-java${targetJava}"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
